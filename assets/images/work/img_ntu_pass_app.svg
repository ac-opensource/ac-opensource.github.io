  <desc id="desc">Concept artwork showing a campus identity app on phone and watch surfaces.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="100%" stop-color="#DCE7F7"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="120" y="120" width="960" height="660" rx="28" fill="#FAF9F4" stroke="#C2CEDF" stroke-width="4"/>
  <rect x="220" y="180" width="340" height="540" rx="36" fill="#153A73"/>
  <rect x="250" y="230" width="280" height="420" rx="20" fill="#F4F8FF"/>
