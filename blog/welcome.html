<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Welcome to my blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: saturate(180%) blur(6px);
            border: 1px solid #e5e7eb;
            border-radius: 1rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-white via-slate-50 to-white text-slate-900">
    <main class="mx-auto max-w-3xl px-4 py-12">
        <article class="card p-6">
            <h1 class="text-2xl font-semibold mb-4">Welcome to my blog</h1>
            <p class="text-slate-700 leading-relaxed">This is the first post on my personal site.</p>
        </article>
    </main>
</body>
</html>
