<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="https://avatars.githubusercontent.com/u/7637791?v=4"/>
        <title>{{TITLE}}</title>
        <meta name="description" content="{{SUMMARY}}" />
        <meta name="author" content="Andrew V. Concepcion" />
        <meta name="robots" content="index, follow" />
        <meta name="theme-color" content="#0b1326" />
        <meta name="keywords" content="{{KEYWORDS}}" />
        <link rel="canonical" href="https://ac-opensource.github.io/blog/{{SLUG}}.html" />
        <meta property="og:site_name" content="Andrew V. Concepcion" />
        <meta property="og:type" content="article" />
        <meta property="og:url" content="https://ac-opensource.github.io/blog/{{SLUG}}.html" />
        <meta property="og:title" content="{{TITLE}}" />
        <meta property="og:description" content="{{SUMMARY}}" />
        <meta
            property="og:image"
            content="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80"
        />
        <meta property="og:image:alt" content="Placeholder image" />
        <meta property="article:published_time" content="{{DATE}}" />
        <!-- TAGS_PLACEHOLDER -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="{{TITLE}}" />
        <meta name="twitter:description" content="{{SUMMARY}}" />
        <meta
            name="twitter:image"
            content="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80"
        />
        <meta name="twitter:image:alt" content="Placeholder image" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600;6..72,700&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/assets/css/site.css" />
        <link rel="stylesheet" href="/assets/css/blog-post.css" />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "BlogPosting",
                "headline": "{{TITLE}}",
                "description": "{{SUMMARY}}",
                "image": "https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80",
                "datePublished": "{{DATE}}",
                "dateModified": "{{DATE}}",
                "author": {
                    "@type": "Person",
                    "name": "Andrew V. Concepcion"
                },
                "publisher": {
                    "@type": "Person",
                    "name": "Andrew V. Concepcion",
                    "url": "https://ac-opensource.github.io/"
                },
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": "https://ac-opensource.github.io/blog/{{SLUG}}.html"
                }
            }
        </script>
    </head>
    <body class="post-page">
        <a class="skip-link" href="#main">Skip to content</a>
        <div class="site-shell">
            <header class="site-header">
                <div class="page-wrap top-nav">
                    <a class="brand" href="/">
                        <span class="brand-mark" aria-hidden="true"></span>
                        Agentic PRD Toolkit
                    </a>
                    <nav id="top-nav-links" class="top-nav-links" aria-label="Primary">
                        <a class="top-nav-link" href="/">Template</a>
                        <a class="top-nav-link active" href="/blog/" data-match="/blog">Blog</a>
                        <a class="top-nav-link" href="/skills-graph.html" data-match="/skills-graph.html">Skills graph</a>
                    </nav>
                    <div class="nav-actions">
                        <button id="menu-toggle" class="btn btn-ghost btn-sm menu-toggle" type="button" aria-expanded="false" aria-controls="top-nav-links">
                            Menu
                        </button>
                        <a class="btn btn-subtle btn-sm" href="/blog/">All posts</a>
                    </div>
                </div>
            </header>

            <main id="main" class="page-wrap narrow">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="/blog/">← Back to blog</a>
                </nav>

                <article class="post-shell">
                    <header>
                        <p>{{CATEGORY}}</p>
                        <h1>{{TITLE}}</h1>
                        <p>
                            Logged on <time datetime="{{DATE}}">{{DISPLAY_DATE}}</time>
                        </p>
                    </header>

                    <figure>
                        <img
                            src="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?auto=format&fit=crop&w=1600&q=80"
                            alt="Placeholder image"
                            referrerpolicy="no-referrer"
                        />
                        <figcaption>Image caption goes here.</figcaption>
                    </figure>

                    <section>
                        <p>Start writing your post here...</p>
                    </section>
                </article>

                <footer class="footer">
                    <div class="footer-row">
                        <p>© <span data-year></span> Andrew Concepcion.</p>
                        <a class="btn btn-subtle btn-sm" href="#main">Back to top</a>
                    </div>
                </footer>
            </main>
        </div>

        <script src="/assets/js/site-ui.js"></script>
    </body>
</html>
