<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Prompt Patterns for Production-Ready Code</title>
  <desc id="d">Abstract blueprint of structured prompts flowing into validated production artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6f7f2"/>
      <stop offset="100%" stop-color="#e8ece3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b63c4"/>
      <stop offset="100%" stop-color="#7da6f7"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#d4dacc" stroke-width="1" opacity="0.65">
    <path d="M0 120h1600M0 240h1600M0 360h1600M0 480h1600M0 600h1600M0 720h1600"/>
    <path d="M120 0v900M320 0v900M520 0v900M720 0v900M920 0v900M1120 0v900M1320 0v900M1520 0v900"/>
  </g>

  <g transform="translate(120 130)">
    <rect x="0" y="0" width="600" height="640" fill="#fafbf7" stroke="#d7ddce" stroke-width="4"/>
    <text x="40" y="68" font-family="Space Grotesk, Arial, sans-serif" font-size="25" fill="#2b63c4" letter-spacing="2">[PROMPT_PATTERN_LIB]</text>

    <rect x="40" y="118" width="520" height="88" fill="#eef2e9"/>
    <text x="60" y="172" font-family="Manrope, Arial, sans-serif" font-size="26" fill="#2f342d" font-weight="700">Role + Objective + Constraints</text>

    <rect x="40" y="238" width="520" height="88" fill="#eef2e9"/>
    <text x="60" y="292" font-family="Manrope, Arial, sans-serif" font-size="26" fill="#2f342d" font-weight="700">Exact Output Contract</text>

    <rect x="40" y="358" width="520" height="88" fill="#eef2e9"/>
    <text x="60" y="412" font-family="Manrope, Arial, sans-serif" font-size="26" fill="#2f342d" font-weight="700">Guardrails + Quality Gates</text>

    <rect x="40" y="478" width="520" height="120" fill="#f4f7f0" stroke="#dce2d3"/>
    <text x="60" y="544" font-family="JetBrains Mono, monospace" font-size="23" fill="#536273">prompt -&gt; patch -&gt; tests -&gt; release</text>
  </g>

  <path d="M760 450h180" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="940" cy="450" r="13" fill="#2b63c4"/>

  <g transform="translate(980 170)">
    <rect x="0" y="0" width="500" height="560" fill="#f4f7f0" stroke="#d8decf" stroke-width="4"/>
    <text x="38" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="24" fill="#2f342d" font-weight="700">PRODUCTION_READINESS</text>
    <g transform="translate(38 110)">
      <rect x="0" y="0" width="424" height="78" fill="#fbfbf8" stroke="#e1e6db"/>
      <text x="24" y="47" font-family="JetBrains Mono, monospace" font-size="22" fill="#2b63c4">[lint] [types] [tests]</text>

      <rect x="0" y="104" width="424" height="78" fill="#fbfbf8" stroke="#e1e6db"/>
      <text x="24" y="151" font-family="JetBrains Mono, monospace" font-size="22" fill="#2b63c4">[a11y] [seo] [e2e]</text>

      <rect x="0" y="208" width="424" height="220" fill="#11161d"/>
      <g font-family="JetBrains Mono, monospace" font-size="18" fill="#8fb3ff">
        <text x="24" y="250">if (checks.passed) {</text>
        <text x="44" y="286">ship();</text>
        <text x="24" y="322">} else {</text>
        <text x="44" y="358">iterate();</text>
        <text x="24" y="394">}</text>
      </g>
    </g>
  </g>

  <text x="120" y="835" font-family="Space Grotesk, Arial, sans-serif" font-size="30" fill="#2b63c4" letter-spacing="3">[PROMPTS_TO_PRODUCTION]</text>
</svg>
