<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Emergenetics Thinking Mix</title>
  <desc id="desc">Donut-style view of Emergenetics thinking percentages.</desc>
  <rect width="1200" height="700" fill="#f6f6f1"/>
  <g transform="translate(140 70)">
    <rect x="0" y="0" width="920" height="560" fill="#fcfcf8" stroke="#dde2d6" stroke-width="3"/>
    <g transform="translate(300 285)">
      <circle r="164" fill="none" stroke="#e4e8df" stroke-width="74"/>
      <path d="M0 -164 A164 164 0 0 1 160.8 -34.6" fill="none" stroke="#1f5cba" stroke-width="74"/>
      <path d="M160.8 -34.6 A164 164 0 0 1 21.4 162.6" fill="none" stroke="#6799fb" stroke-width="74"/>
      <path d="M21.4 162.6 A164 164 0 0 1 -151.1 63.6" fill="none" stroke="#6d7f99" stroke-width="74"/>
      <path d="M-151.1 63.6 A164 164 0 0 1 0 -164" fill="none" stroke="#8592a8" stroke-width="74"/>
      <circle r="94" fill="#fcfcf8"/>
      <text x="0" y="-5" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-size="30" font-weight="700" fill="#2f342d">THINKING</text>
      <text x="0" y="32" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#5a5f65">Profile Mix</text>
    </g>
    <g transform="translate(560 120)" font-family="Manrope, Arial, sans-serif">
      <text x="0" y="-26" font-family="Space Grotesk, Arial, sans-serif" font-size="24" letter-spacing="2" fill="#1f5cba">[EMERGENETICS_THINKING]</text>
      <g transform="translate(0 24)">
        <rect x="0" y="0" width="22" height="22" fill="#1f5cba"/>
        <text x="34" y="17" font-size="28" font-weight="700" fill="#2f342d">Analytical</text>
        <text x="300" y="17" font-size="28" fill="#2f342d">33%</text>
      </g>
      <g transform="translate(0 88)">
        <rect x="0" y="0" width="22" height="22" fill="#6799fb"/>
        <text x="34" y="17" font-size="28" font-weight="700" fill="#2f342d">Conceptual</text>
        <text x="300" y="17" font-size="28" fill="#2f342d">32%</text>
      </g>
      <g transform="translate(0 152)">
        <rect x="0" y="0" width="22" height="22" fill="#6d7f99"/>
        <text x="34" y="17" font-size="28" font-weight="700" fill="#2f342d">Structural</text>
        <text x="300" y="17" font-size="28" fill="#2f342d">20%</text>
      </g>
      <g transform="translate(0 216)">
