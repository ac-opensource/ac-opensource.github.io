<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Building an Editable Blog System for GitHub Pages</title>
  <desc id="d">Abstract architecture map connecting a SQLite editor workflow to static page generation and feeds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7f2"/>
      <stop offset="100%" stop-color="#e7ebe2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#245fbe"/>
      <stop offset="100%" stop-color="#7da7f8"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="#d2d8ca" stroke-width="1" opacity="0.64">
    <path d="M0 120h1600M0 240h1600M0 360h1600M0 480h1600M0 600h1600M0 720h1600"/>
    <path d="M120 0v900M320 0v900M520 0v900M720 0v900M920 0v900M1120 0v900M1320 0v900M1520 0v900"/>
  </g>

  <g transform="translate(120 150)">
    <rect x="0" y="0" width="420" height="580" fill="#fafbf7" stroke="#d7ddce" stroke-width="4"/>
    <text x="38" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="24" fill="#245fbe" letter-spacing="2">[EDITOR_LAYER]</text>
    <rect x="38" y="104" width="344" height="428" fill="#f2f5ee" stroke="#dfe5d6"/>
    <text x="64" y="154" font-family="JetBrains Mono, monospace" font-size="20" fill="#4f5f74">Title</text>
    <rect x="64" y="170" width="292" height="36" fill="#ffffff" stroke="#d8dfd0"/>
    <text x="64" y="246" font-family="JetBrains Mono, monospace" font-size="20" fill="#4f5f74">Body (WYSIWYG)</text>
    <rect x="64" y="262" width="292" height="216" fill="#ffffff" stroke="#d8dfd0"/>
    <text x="80" y="312" font-family="Manrope, Arial, sans-serif" font-size="21" fill="#5f6670">Write once, publish anywhere.</text>
    <rect x="64" y="496" width="186" height="40" fill="#5d6470"/>
    <text x="92" y="522" font-family="JetBrains Mono, monospace" font-size="18" fill="#f4f5f1">SAVE ENTRY</text>
  </g>

  <g transform="translate(620 240)">
    <ellipse cx="170" cy="190" rx="170" ry="90" fill="#edf2ea" stroke="#cfd8cc" stroke-width="4"/>
    <ellipse cx="170" cy="190" rx="170" ry="90" transform="translate(0 70)" fill="#edf2ea" stroke="#cfd8cc" stroke-width="4"/>
    <rect x="0" y="190" width="340" height="70" fill="#edf2ea" stroke="#cfd8cc" stroke-width="4"/>
    <text x="98" y="238" font-family="Space Grotesk, Arial, sans-serif" font-size="30" fill="#245fbe" font-weight="700">SQLite</text>
  </g>

  <path d="M560 430h110M960 430h110" stroke="url(#accent)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="670" cy="430" r="12" fill="#245fbe"/>
  <circle cx="1070" cy="430" r="12" fill="#245fbe"/>

  <g transform="translate(1120 150)">
    <rect x="0" y="0" width="360" height="580" fill="#f4f7f0" stroke="#d8decf" stroke-width="4"/>
    <text x="34" y="62" font-family="Space Grotesk, Arial, sans-serif" font-size="24" fill="#2f342d" font-weight="700">STATIC_OUTPUT</text>

    <rect x="34" y="108" width="292" height="78" fill="#fbfbf8" stroke="#dee5d7"/>
    <text x="56" y="156" font-family="JetBrains Mono, monospace" font-size="19" fill="#245fbe">/blog/post.html</text>

    <rect x="34" y="206" width="292" height="78" fill="#fbfbf8" stroke="#dee5d7"/>
    <text x="56" y="254" font-family="JetBrains Mono, monospace" font-size="19" fill="#245fbe">/blog/posts.json</text>

    <rect x="34" y="304" width="292" height="78" fill="#fbfbf8" stroke="#dee5d7"/>
    <text x="56" y="352" font-family="JetBrains Mono, monospace" font-size="19" fill="#245fbe">/blog/rss.xml</text>

    <rect x="34" y="402" width="292" height="132" fill="#11161d"/>
    <text x="56" y="450" font-family="JetBrains Mono, monospace" font-size="17" fill="#8fb3ff">GitHub Pages compatible</text>
    <text x="56" y="484" font-family="JetBrains Mono, monospace" font-size="17" fill="#8fb3ff">SEO + Open Graph ready</text>
  </g>

  <text x="120" y="836" font-family="Space Grotesk, Arial, sans-serif" font-size="30" fill="#245fbe" letter-spacing="3">[EDITABLE_AUTHORING__STATIC_DELIVERY]</text>
</svg>
