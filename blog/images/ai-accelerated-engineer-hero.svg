    <g fill="#1f5cba">
      <circle cx="86" cy="184" r="13"/><circle cx="226" cy="122" r="11"/><circle cx="342" cy="196" r="12"/>
      <circle cx="418" cy="136" r="10"/><circle cx="170" cy="286" r="11"/><circle cx="320" cy="330" r="12"/>
      <circle cx="432" cy="260" r="10"/><circle cx="280" cy="438" r="13"/><circle cx="424" cy="404" r="12"/>
    </g>
    <text x="36" y="540" font-family="Manrope, Arial, sans-serif" font-size="24" fill="#2f342d" font-weight="600">Workflow • Speed • Scope</text>
  </g>

  <text x="130" y="830" font-family="Space Grotesk, Arial, sans-serif" font-size="30" fill="#1f5cba" letter-spacing="3">[AI_ACCELERATED_ENGINEER]</text>
