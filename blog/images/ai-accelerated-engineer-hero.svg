    <text x="34" y="60" font-family="Space Grotesk, Arial, sans-serif" font-size="24" fill="#2f342d" font-weight="700">MOBILE_STACK</text>
    <rect x="36" y="110" width="398" height="52" fill="#e5e9df"/>
    <rect x="36" y="186" width="398" height="52" fill="#e5e9df"/>
    <rect x="36" y="262" width="398" height="52" fill="#e5e9df"/>
    <rect x="36" y="338" width="398" height="52" fill="#e5e9df"/>
