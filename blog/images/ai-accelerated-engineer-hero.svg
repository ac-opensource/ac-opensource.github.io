    <text x="52" y="220" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#5a5f65">State + Networking</text>
    <text x="52" y="296" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#5a5f65">Storage + Analytics</text>
    <text x="52" y="372" font-family="Manrope, Arial, sans-serif" font-size="20" fill="#5a5f65">Release + QA</text>
  </g>

  <path d="M670 450h240" stroke="url(#beam)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="910" cy="450" r="12" fill="#1f5cba"/>

  <g transform="translate(970 120)">
    <rect x="0" y="0" width="500" height="620" fill="#f7f9f4" stroke="#d7ddce" stroke-width="3"/>
    <text x="36" y="58" font-family="Space Grotesk, Arial, sans-serif" font-size="24" fill="#1f5cba" font-weight="700">AI_ACCELERATED_GRAPH</text>
    <g stroke="#8e9db2" stroke-width="3" fill="none">
