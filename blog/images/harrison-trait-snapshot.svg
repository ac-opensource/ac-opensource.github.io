<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Harrison Trait Snapshot</title>
  <desc id="desc">Horizontal bars showing selected Harrison assessment scores.</desc>
  <rect width="1200" height="680" fill="#f5f6f1"/>
  <rect x="100" y="70" width="1000" height="540" fill="#fbfbf7" stroke="#d9dfd2" stroke-width="3"/>
  <text x="146" y="122" font-family="Space Grotesk, Arial, sans-serif" font-size="26" letter-spacing="2" fill="#1f5cba">[HARRISON_HIGHLIGHT_SCORES]</text>
  <g font-family="Manrope, Arial, sans-serif">
    <g transform="translate(146 180)">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#2f342d">Open / Reflective</text>
      <rect x="320" y="-24" width="560" height="28" fill="#e4e8de"/>
      <rect x="320" y="-24" width="548.8" height="28" fill="#1f5cba"/>
      <text x="900" y="0" font-size="26" text-anchor="end" fill="#2f342d">9.8</text>
    </g>
    <g transform="translate(146 250)">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#2f342d">Flexible</text>
      <rect x="320" y="-24" width="560" height="28" fill="#e4e8de"/>
      <rect x="320" y="-24" width="543.2" height="28" fill="#356ec6"/>
      <text x="900" y="0" font-size="26" text-anchor="end" fill="#2f342d">9.7</text>
    </g>
    <g transform="translate(146 320)">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#2f342d">Analytical</text>
      <rect x="320" y="-24" width="560" height="28" fill="#e4e8de"/>
      <rect x="320" y="-24" width="520.8" height="28" fill="#4b7fd1"/>
      <text x="900" y="0" font-size="26" text-anchor="end" fill="#2f342d">9.3</text>
    </g>
    <g transform="translate(146 390)">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#2f342d">Helpful</text>
      <rect x="320" y="-24" width="560" height="28" fill="#e4e8de"/>
      <rect x="320" y="-24" width="464.8" height="28" fill="#6799fb"/>
      <text x="900" y="0" font-size="26" text-anchor="end" fill="#2f342d">8.3</text>
    </g>
    <g transform="translate(146 460)">
      <text x="0" y="0" font-size="28" font-weight="700" fill="#2f342d">Optimistic</text>
      <rect x="320" y="-24" width="560" height="28" fill="#e4e8de"/>
      <rect x="320" y="-24" width="448" height="28" fill="#87adf8"/>
      <text x="900" y="0" font-size="26" text-anchor="end" fill="#2f342d">8.0</text>
    </g>
  </g>
  <g transform="translate(146 532)">
    <rect x="0" y="0" width="880" height="54" fill="#f1f4ec" stroke="#d9dfd2"/>
    <text x="18" y="34" font-family="Manrope, Arial, sans-serif" font-size="22" fill="#5a5f65">
      Watchpoint: Assertive 4.1 suggests preference for collaborative outcomes over hard self-prioritization.
    </text>
  </g>
</svg>
