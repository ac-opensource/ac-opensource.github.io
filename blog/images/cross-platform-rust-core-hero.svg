  <text x="144" y="746" fill="#6B7268" font-family="Space Grotesk, Arial, sans-serif" font-size="24">one domain core, two native shells, no duplicated platform logic</text>
  <text x="1095" y="804" fill="#245FBE" font-family="Space Grotesk, Arial, sans-serif" font-size="24" font-weight="700">Rust / UniFFI / Android / iOS</text>
